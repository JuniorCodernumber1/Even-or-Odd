<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or Odd</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: #000000;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 1rem;
        }

        input {
            border: 2px solid #ff0000;
            color: #123f3e;
            border-radius: 0.75rem;
            font-size: 1rem;
            max-width: 28rem;
            min-height: 3rem;
            padding: 0.75rem 1rem;
            width: 100%;
        }

        input:focus {
            border-color: #ff0000;
            outline: 3px solid #ffffff;
        }
    </style>
</head>
<body>
    <input type="text" id="numberInput" inputmode="text" autocapitalize="none" autocomplete="off" aria-label="Enter a number or x">

    <script>
        const input = document.getElementById("numberInput");

        input.addEventListener("input", function() {
            input.value = input.value.replace(/[a-wy-z]/gi, "");
        });

        input.addEventListener("change", function() {
            const value = input.value.toLowerCase();
            const number = value === "" ? "" : /^x+$/.test(value) ? value : Number(value);
            analyzeNumber(number);
            input.value = "";
        });

        x = "string";
        function evOddUndef(num) {
            if (typeof num === "string") {
                return "Undefined";
            }
            if (num % 2 === 0) {
                return "Even";
            }
            if (num % 2 !== 0) {
                return "Odd";
            }
        }

        function posNegZero(num) {
            if (typeof num === "string") {
                return "Undefined";
            }
            if (num === 0) {
                return "Zero";
            }
            if (num > 0) {
                return "Positive";
            }
            if (num < 0) {
                return "Negative";
            }
        }

        function analyzeNumber(num) {
            alert(evOddUndef(num));
            alert(posNegZero(num));
        }

    </script>
</body>
</html>
